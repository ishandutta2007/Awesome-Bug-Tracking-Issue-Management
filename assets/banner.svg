<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Animation Keyframes */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(25px, -20px); opacity: 0.55; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .dynamic-orb1 { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 200px 100px; }
    .dynamic-orb2 { animation: pulseOrb2 12s ease-in-out infinite; transform-origin: 1000px 300px; }
    .particle1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .beam-line { stroke-dasharray: 60 120; animation: beamFlow 14s linear infinite; }
    .cursor-blink { animation: blinkCursor 1s step-start infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="dynamic-orb1">
    <circle cx="200" cy="90" r="180" fill="url(#glowGrad1)" filter="url(#glow)" />
  </g>
  <g class="dynamic-orb2">
    <circle cx="1020" cy="300" r="210" fill="url(#glowGrad2)" filter="url(#glow)" />
  </g>

  <!-- Technical Grid Pattern Background -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Animated Circuit Flow Lines (in Background) -->
  <g fill="none" stroke-width="1.5">
    <path d="M 50 80 Q 250 80 400 160 T 800 240 T 1150 240" stroke="#0ea5e9" stroke-opacity="0.4" class="beam-line" />
    <path d="M 50 320 Q 350 320 500 240 T 900 160 T 1150 160" stroke="#8b5cf6" stroke-opacity="0.4" class="beam-line" style="animation-duration: 18s;" />
  </g>

  <!-- Subtle Floating Data Particles in Background -->
  <circle cx="180" cy="220" r="3" fill="#38bdf8" class="particle1" />
  <circle cx="340" cy="110" r="2.5" fill="#818cf8" class="particle2" />
  <circle cx="890" cy="90" r="3" fill="#c084fc" class="particle3" />
  <circle cx="1040" cy="210" r="2.5" fill="#38bdf8" class="particle1" />

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Pill / Badge -->
  <g transform="translate(435, 48)">
    <rect width="330" height="34" rx="17" fill="url(#pillGrad1)" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" class="mono" font-size="12" fill="#94a3b8" letter-spacing="1">CURATED SDLC ECOSYSTEM</text>
    <rect x="238" y="7" width="80" height="20" rx="10" fill="#3b82f6" fill-opacity="0.2" />
    <text x="250" y="21" class="mono" font-size="11" font-weight="bold" fill="#60a5fa">v2026.1</text>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="148" text-anchor="middle" class="sans" font-weight="900" font-size="44" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
    Awesome Bug Tracking
  </text>
  <text x="600" y="196" text-anchor="middle" class="sans" font-weight="800" font-size="34" fill="#f8fafc" letter-spacing="-0.3">
    &amp; Issue Management
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="240" text-anchor="middle" class="sans" font-weight="400" font-size="17" fill="#94a3b8">
    Enterprise SaaS Platforms • Self-Hosted Open-Source • Defect Workflows • Agile Sprints
  </text>

  <!-- Interactive / Functional Feature Badges (Bottom Row) -->
  <g transform="translate(195, 290)">
    <!-- Pill 1: SaaS Comparison -->
    <g transform="translate(0, 0)">
      <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="92" y="26" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#e2e8f0">⚡ SaaS Benchmarks</text>
    </g>
    <!-- Pill 2: Open Source Stars -->
    <g transform="translate(205, 0)">
      <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="92" y="26" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#e2e8f0">⭐ Open-Source Stars</text>
    </g>
    <!-- Pill 3: Market Size & CAGRs -->
    <g transform="translate(410, 0)">
      <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
      <text x="92" y="26" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#e2e8f0">📊 Market Dynamics</text>
    </g>
    <!-- Pill 4: Free Limits Matrix -->
    <g transform="translate(615, 0)">
      <rect width="195" height="42" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
      <text x="97" y="26" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#e2e8f0">🎯 Pricing &amp; Free Tiers</text>
    </g>
  </g>

  <!-- Bottom Terminal Command / Prompt Line -->
  <g transform="translate(400, 368)">
    <text x="0" y="0" class="mono" font-size="13" fill="#64748b">git clone https://github.com/ishandutta2007/Awesome-Bug-Tracking-Issue-Management</text>
    <rect x="398" y="-11" width="8" height="14" fill="#38bdf8" class="cursor-blink" />
  </g>
</svg>
